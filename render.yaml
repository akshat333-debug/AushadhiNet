# Only the frontend runs on Render (2026-10-26), so the submitted link works; it calls the Cloud Run
# backend. The backend service here is suspended, kept as an example of the zero-credential local mode.
# Render blueprint: backend + frontend, both from the repo's Dockerfiles.
# Deploy with Render Dashboard -> New -> Blueprint, pointed at this repo.
#
# Free instances have 512 MB RAM and sleep when idle: the first request after a
# sleep takes ~30-60s. Serving fits in ~370 MB (see state.md).
services:
  - type: web
    name: aushadhinet-backend
    runtime: docker
    repo: https://github.com/akshat333-debug/AushadhiNet
    branch: master
    region: singapore
    plan: free
    dockerfilePath: ./infra/Dockerfile.backend
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: AUSHADHI_MODE
        value: local            # no GCP credentials; the demo runs on the sealed ledger
      - key: SERVED_STATES
        value: maharashtra
      - key: SERVING_WEEKS
        value: "16"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CORS_ALLOWED_ORIGINS
        value: https://aushadhinet-frontend.onrender.com
      - key: GEMINI_API_KEY      # set in the Render dashboard, never committed; photos are read by Gemini when present
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite

  - type: web
    name: aushadhinet-frontend
    runtime: docker
    repo: https://github.com/akshat333-debug/AushadhiNet
    branch: master
    region: singapore
    plan: free
    dockerfilePath: ./infra/Dockerfile.frontend
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        value: https://aushadhinet-backend-449585498230.asia-south1.run.app
