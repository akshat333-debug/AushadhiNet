# Cloud Build pipeline (architecture.md §1): builds and deploys the
# backend to Cloud Run. Deferred until GCP credits arrive (AC11) -- not
# run in this session, but the pipeline shape is real and lint-checked.
steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/aushadhinet-backend", "-f", "infra/Dockerfile.backend", "."]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/aushadhinet-backend"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - aushadhinet-backend
      - "--image=gcr.io/$PROJECT_ID/aushadhinet-backend"
      - "--region=asia-south1"
      - "--platform=managed"
      - "--set-env-vars=AUSHADHI_MODE=cloud"
      - "--no-allow-unauthenticated"

images:
  - "gcr.io/$PROJECT_ID/aushadhinet-backend"

options:
  logging: CLOUD_LOGGING_ONLY
