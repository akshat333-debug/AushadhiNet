# AC10: the whole demo loop runs with zero GCP credentials.
# `docker compose -f infra/docker-compose.yml up --build`, then open http://localhost:3000
services:
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    ports: ["8000:8000"]
    environment:
      - AUSHADHI_MODE=local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 30s
      retries: 30
      start_period: 60s

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      backend:
        condition: service_healthy
