[project]
name = "aushadhinet"
version = "0.1.0"
description = "Federated AI for India's last-mile health resource network"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ml = [
    "pandas>=3.0.6",
    "numpy>=1.26",
    "lightgbm>=4.7",
    "statsforecast>=2.0.1",
    "pypdf>=6.19.0",
    "pyarrow>=25.0.1",
    "timesfm>=3.0.2",
    "flwr>=1.37,<4.0",
    "ortools>=9.15",
    "duckdb>=1.1",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "pillow>=10.4",
]
gcp = [
    "google-genai>=2.0",
    "google-cloud-speech>=2.40",
    "google-cloud-translate>=3.15",
    "google-cloud-texttospeech>=2.16",
    "google-cloud-firestore>=2.19",
    "google-cloud-bigquery>=3.25",
    "google-adk>=2.9",
    "twilio>=9.0",
    "requests>=2.32",
    "cryptography>=43.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "twilio>=9.0",  # signature-validation tests run even without the gcp extra
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "ml", "eval"]
