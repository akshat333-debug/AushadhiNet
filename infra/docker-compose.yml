# AC10: the whole demo loop runs with zero GCP credentials.
# `docker compose up` from the repo root, then open http://localhost:3000
services:
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    ports: ["8000:8000"]
    environment:
      - AUSHADHI_MODE=local
    volumes:
      - ../data:/app/data

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    ports: ["3000:3000"]
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      - backend
